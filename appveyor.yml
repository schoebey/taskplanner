version: 1.0.{build}
image: 
  - Ubuntu2204
  - Visual Studio 2022
platform: 
  - x64
configuration: 
  - Release 

matrix:
  fast_finish: true

for:
  -
    matrix:
      only:
        - image: Ubuntu2204

    install:
      - git submodule update --init --recursive

    before_build:
      - sh: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools && Qt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6 cmake .

    build_script:
      - make 

    test_script:

  -
    matrix:
      only:
        - image: Visual Studio 2022

    install:
      - set Qt6_DIR=c:\Qt\6.8.3\msvc2022_64\lib\cmake\Qt6
      - set QTDIR=c:\Qt\6.8.3\msvc2022_64
      - set PATH=%PATH%;%QTDIR%\bin;
      - git submodule update --init --recursive

    before_build:
      - cmake -G "Visual Studio 17 2022 Win64" .
    
    build_script:
      - msbuild %APPVEYOR_PROJECT_NAME%.sln
