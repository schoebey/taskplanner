version: 1.0.{build}
image: 
  - Ubuntu2204
  - Visual Studio 2022
platform: 
  - x64
configuration: 
  - Release 

matrix:
  fast_finish: true

for:
  -
    matrix:
      only:
        - image: Ubuntu2204

    install:
      - git submodule update --init --recursive

    before_build:
      - sh: export Qt6_DIR=$(find $HOME/Qt /opt/Qt /usr -maxdepth 8 -type f -name "Qt6Config.cmake" 2>/dev/null | head -n 1 | xargs dirname) && echo "Using Qt6_DIR=$Qt6_DIR" && echo "export LD_LIBRARY_PATH=$(dirname $(dirname $Qt6_DIR)):\$LD_LIBRARY_PATH" > /tmp/qtenv.sh && cmake .

    build_script:
      - sh: source /tmp/qtenv.sh && make

    test_script:

  -
    matrix:
      only:
        - image: Visual Studio 2022

    install:
      - set Qt6_DIR=c:\Qt\6.8.3\msvc2022_64\lib\cmake\Qt6
      - set QTDIR=c:\Qt\6.8.3\msvc2022_64
      - set PATH=%PATH%;%QTDIR%\bin;
      - git submodule update --init --recursive

    before_build:
      - cmake -G "Visual Studio 17 2022 Win64" .
    
    build_script:
      - msbuild %APPVEYOR_PROJECT_NAME%.sln
